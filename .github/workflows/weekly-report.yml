name: Weekly Fantasy Football Report

on:
  # Scheduled runs are active during the NFL season.
  # To pause reporting for the off-season, comment out the schedule block below.
  schedule:
    # Run every Tuesday at 05:00 UTC (1am EDT or 12am EST)
    # Off-peak slot on purpose: the old 10:00 UTC slot drifted 4-6h late under
    # peak platform load once the NFL season ramped up (Sept 2026).
    - cron: '0 5 * * 2'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      week_number:
        description: 'Week number to generate report for (1-18, leave empty for auto-detect)'
        required: false
        type: number
      email_recipients:
        description: 'Email recipients (comma-separated, leave empty to use default from secrets)'
        required: false
        type: string
      email_from:
        description: 'Email sender (leave empty to use default from secrets)'
        required: false
        type: string
      skip_email:
        description: 'Skip sending email (useful for testing report generation only)'
        required: false
        type: boolean
        default: false
      weekly_note:
        description: 'Optional note for this week (e.g., "Season ends Week 14! Playoffs start Week 15!")'
        required: false
        type: string
      ai_summary_prompt:
        description: 'One-run AI summary instructions (overrides the repository variable/secret; single line; leave empty to use the standing prompt)'
        required: false
        type: string
      update_memory:
        description: 'Update the shared memory log (uncheck for a test run that reads the archive without writing it)'
        required: false
        type: boolean
        default: true

env:
  PYTHONUNBUFFERED: 1
  # Key-only guard. `secrets` cannot be referenced in `if:` (it evaluates empty
  # there and would silently disable the feature), so the expression renders the
  # literal true/false here and the .env step below reads it.
  AI_SUMMARY_ENABLED: ${{ secrets.AI_SUMMARY_API_KEY != '' }}
  # Optional settings come from repository variables, so they are changed in
  # Settings -> Secrets and variables -> Actions -> Variables, not in this file.
  # An unset variable renders as an empty string, and the loader reads blank as
  # "use the default" - no shell guard is needed for any of these.
  AI_SUMMARY_BASE_URL: ${{ vars.AI_SUMMARY_BASE_URL }}
  AI_SUMMARY_MODEL: ${{ vars.AI_SUMMARY_MODEL }}
  AI_SUMMARY_TIMEOUT: ${{ vars.AI_SUMMARY_TIMEOUT }}
  AI_SUMMARY_MAX_TOKENS: ${{ vars.AI_SUMMARY_MAX_TOKENS }}
  AI_SUMMARY_REASONING_EFFORT: ${{ vars.AI_SUMMARY_REASONING_EFFORT }}
  AI_SUMMARY_MAX_PROMPT_CHARS: ${{ vars.AI_SUMMARY_MAX_PROMPT_CHARS }}
  # Memory guard, the same shape as the key guard above: `secrets` cannot appear
  # in `if:`, so the expression renders the literal true/false here and the loader
  # reads it. Empty either setting and memory is simply off.
  AI_MEMORY_ENABLED: ${{ secrets.AI_MEMORY_GIST_TOKEN != '' && vars.AI_MEMORY_GIST_ID != '' }}

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        version: "latest-known"

    - name: Install dependencies
      run: uv sync

    - name: Create .env file from secrets
      run: |
        echo "LEAGUE_IDS=${{ secrets.LEAGUE_IDS }}" > .env
        if [ -n "${{ secrets.ESPN_SWID }}" ]; then
          echo "ESPN_SWID=${{ secrets.ESPN_SWID }}" >> .env
        fi
        if [ -n "${{ secrets.ESPN_S2 }}" ]; then
          echo "ESPN_S2=${{ secrets.ESPN_S2 }}" >> .env
        fi
        # Only when the key exists, so a checkout without it ships a normal
        # report with the feature off instead of failing on a missing key.
        if [ "$AI_SUMMARY_ENABLED" = "true" ]; then
          echo "AI_SUMMARY_ENABLED=true" >> .env
          echo "AI_SUMMARY_API_KEY=${{ secrets.AI_SUMMARY_API_KEY }}" >> .env
        fi

    - name: Generate fantasy football report
      id: generate-report
      # The prompt is scoped to this step: it is the only consumer, and keeping it
      # out of the workflow-level env means checkout, setup-python, setup-uv and the
      # .env writer never see a secret the prompt may hold. Precedence is the one-run
      # dispatch input, then the repository variable, then the secret. Each empty
      # value falls through to the next rather than clearing it, and dispatch string
      # inputs are single-line, so a multi-line standing prompt belongs in the
      # variable or the secret. Keep every comment above the key.
      # The gist id and token are scoped to this step, their only consumer, so
      # checkout, setup-python, setup-uv and the .env writer never see the token.
      # Neither is written to .env: the process reads them from this env directly.
      # update_memory is the one-run read-only switch. It is a plain expression,
      # not a `||` chain: on a schedule `inputs` is empty, which renders as a
      # blank value the loader reads as its default (write), and a `||` fallback
      # would swallow a deliberate false.
      env:
        AI_SUMMARY_USER_PROMPT: ${{ inputs.ai_summary_prompt || vars.AI_SUMMARY_USER_PROMPT || secrets.AI_SUMMARY_USER_PROMPT }}
        AI_MEMORY_GIST_ID: ${{ vars.AI_MEMORY_GIST_ID }}
        AI_MEMORY_GIST_TOKEN: ${{ secrets.AI_MEMORY_GIST_TOKEN }}
        AI_MEMORY_WRITE: ${{ inputs.update_memory }}
      run: |
        # Hardcoded note for this week (set to empty string to disable)
        # Example: HARDCODED_NOTE="Playoffs start next week! 🏆"
        # HARDCODED_NOTE="Final week! Championship game next week to crown the overall champion! 🏆"

        # Determine if private leagues are needed
        if [ -n "${{ secrets.ESPN_SWID }}" ] && [ -n "${{ secrets.ESPN_S2 }}" ]; then
          PRIVATE_FLAG="--private"
        else
          PRIVATE_FLAG=""
        fi

        # Add week override if provided
        if [ -n "${{ inputs.week_number }}" ]; then
          WEEK_FLAG="--week ${{ inputs.week_number }}"
          echo "Using week override: ${{ inputs.week_number }}"
          echo "is_historical=true" >> $GITHUB_OUTPUT
        else
          WEEK_FLAG=""
          echo "Using auto-detected current week"
          echo "is_historical=false" >> $GITHUB_OUTPUT
        fi

        # Build format args - workflow input takes precedence over hardcoded note
        if [ -n "${{ inputs.weekly_note }}" ]; then
          FORMAT_ARGS=(--format-arg "note=${{ inputs.weekly_note }}")
        elif [ -n "$HARDCODED_NOTE" ]; then
          FORMAT_ARGS=(--format-arg "note=$HARDCODED_NOTE")
        else
          FORMAT_ARGS=()
        fi

        # Capture start time
        START_TIME=$(date +%s)

        # Generate all output formats in one execution using --output-dir
        uv run ff-tracker --env $PRIVATE_FLAG $WEEK_FLAG --output-dir ./reports "${FORMAT_ARGS[@]}"

        # Calculate execution time
        END_TIME=$(date +%s)
        EXECUTION_TIME=$((END_TIME - START_TIME))

        # Extract current week from console output
        CURRENT_WEEK=$(grep "^CURRENT_WEEK=" ./reports/standings.txt | cut -d'=' -f2)

        # Fallback to date-based calculation if parsing fails
        if [ -z "$CURRENT_WEEK" ] || [ "$CURRENT_WEEK" = "unknown" ]; then
          CURRENT_WEEK=$(date +%U)
          echo "Warning: Could not extract current week from output, using date-based fallback: $CURRENT_WEEK"
        else
          echo "Extracted current week from fantasy football data: $CURRENT_WEEK"
        fi

        echo "current_week=${CURRENT_WEEK}" >> $GITHUB_OUTPUT
        echo "execution_time=${EXECUTION_TIME}" >> $GITHUB_OUTPUT
        echo "report_generated=true" >> $GITHUB_OUTPUT

    # Read HTML report content for email body
    - name: Prepare email content
      id: prepare-email
      if: steps.generate-report.outputs.report_generated == 'true'
      run: |
        # Inject metadata into HTML report
        GENERATED_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
        EXECUTION_TIME="${{ steps.generate-report.outputs.execution_time }}"
        RUN_ID="${{ github.run_id }}"
        REPO="${{ github.repository }}"

        # Create metadata HTML
        METADATA_HTML="Generated: ${GENERATED_TIME} (took ${EXECUTION_TIME}s)<br>"
        METADATA_HTML+="<a href=\"https://github.com/${REPO}/actions/runs/${RUN_ID}\" style=\"color: #3498db; text-decoration: none;\">Download Full Report Artifacts 📦</a><br>"

        # Inject metadata between comment markers using sed
        sed -i "s|<!-- GENERATED_METADATA_START --><!-- GENERATED_METADATA_END -->|<!-- GENERATED_METADATA_START -->${METADATA_HTML}<!-- GENERATED_METADATA_END -->|g" ./reports/standings.html

        # Verify the file exists and was modified
        if [ -f ./reports/standings.html ]; then
          echo "html_ready=true" >> $GITHUB_OUTPUT
          echo "Successfully injected metadata into HTML report"
        else
          echo "html_ready=false" >> $GITHUB_OUTPUT
          echo "Error: HTML file not found" >&2
          exit 1
        fi

    - name: Send email report
      if: steps.generate-report.outputs.report_generated == 'true' && inputs.skip_email != true
      uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968  # v22
      with:
        server_address: ${{ secrets.SMTP_SERVER }}
        server_port: ${{ secrets.SMTP_PORT || '2525' }}
        secure: ${{ secrets.SMTP_SECURE || 'false' }}
        username: ${{ secrets.SMTP_USERNAME }}
        password: ${{ secrets.SMTP_PASSWORD }}
        subject: "${{ steps.generate-report.outputs.is_historical == 'true' && format('Historical Fantasy Football Report - Week {0}', steps.generate-report.outputs.current_week) || format('Weekly Fantasy Football Report - Week {0}', steps.generate-report.outputs.current_week) }}"
        from: "MM Fantasy Football League <${{ inputs.email_from || secrets.EMAIL_FROM }}>"
        to: ${{ inputs.email_from || secrets.EMAIL_FROM }}
        bcc: ${{ inputs.email_recipients || secrets.EMAIL_RECIPIENTS }}
        html_body: file://./reports/standings.html

    - name: Upload report artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ steps.generate-report.outputs.is_historical == 'true' && format('historical-report-week-{0}', steps.generate-report.outputs.current_week) || format('weekly-report-week-{0}', steps.generate-report.outputs.current_week) }}
        path: |
          ./reports/standings.txt
          ./reports/standings.tsv
          ./reports/standings.html
          ./reports/standings.json
          ./reports/standings.md
        retention-days: 30
